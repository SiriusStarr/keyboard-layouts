layout:
  qmk_info_json: layouts/svalboard-info.json
layers:
  Base:
    - [
        V,
        W,
        G,
        M,
        { t: ., s: ":" },
        { t: /, s: \ },
        { t: '"', s: "?" },
        { t: "'", s: "!" },
      ]
    - [
        { t: S, h: Meta },
        { t: N, h: Alt },
        { t: T, h: Ctrl },
        { t: H, h: Shift },

        { t: A, h: Shift },
        { t: E, h: Ctrl },
        { t: I, h: Alt },
        { t: C, h: Meta },
      ]
    - [
        Z,
        X,
        J,
        K,
        { t: ",", s: ";" },
        { t: "*", s: "#" },
        { t: "-", s: _ },
        { t: "QU", h: "Q" },
      ]
    - [{ t: F, h: Button }, P, D, L, U, O, Y, { t: B, h: Button }]
    - [
        { t: R, h: N&S },
        { t: ⌫, s: ⌦ },
        { t: Esc, h: F&M },
        { t: ⭾, h: Mouse },
        ↵,
        { t: ␣, h: Nav },
      ]
  Numbers & Symbols:
    - ["%", "@", $, { t: "~", s: "^" }, 7, 8, 9, ""]
    - [
        { t: "<", h: Meta },
        { t: "-", h: Alt },
        { t: "|", h: Ctrl },
        { t: ">", h: Shift },
        { t: 1, h: Shift },
        { t: 2, h: Ctrl },
        { t: 5, h: Alt },
        { t: 0, h: Meta },
      ]
    - [
        "",
        "",
        "",
        "",
        { t: ",", s: ";" },
        { t: "*", s: "#" },
        { t: "-", s: _ },
        "",
      ]
    - ["&", +, "=", "`", 3, 4, 6, ""]
    - [{ type: held }, "", "", "", ",", "."]
  Nav:
    - [
        Ins,
        "Caps Lock",
        { t: "Sel Word", s: "Sel Sent" },
        "Caps Word",
        Paste,
        Copy,
        Cut,
        Undo,
      ]
    - [←, ↑, ↓, →, Shift, Ctrl, Alt, Meta]
    - ["", "", "", "", Redo, Redo, Redo, ""]
    - [Home, Pg Up, Pg Dn, End, Paste, Copy, Cut, Undo]
    - [Left Clck, Right Clck, Mid Clck, "", "", { type: held }]
  Function & Media:
    - ["", 🔆, 🔅, "", F7, F8, F9, F12]
    - [
        Meta,
        { t: 🔇, h: Alt },
        { t: ◼, h: Ctrl },
        { t: ⏯, h: Shift },
        F1,
        F2,
        F5,
        F10,
      ]
    - ["", "", "", "", Scrll Lock, PrSc SyRq, Ps Brk, ""]
    - [⏮, 🔊, 🔉, ⏭, F3, F4, F6, F11]
    - ["", "", { type: held }, ⭾, ↵, ␣]
  Mouse:
    - ["", "", "", "", Paste, Copy, Cut, Undo]
    - [🖰 Left, 🖰 Up, 🖰 Down, 🖰 Right, Shift, Ctrl, Alt, Meta]
    - ["", "", "", "", Redo, Redo, Redo, ""]
    - [
        Scroll Left,
        Scroll Up,
        Scroll Down,
        Scroll Right,
        Paste,
        Copy,
        Cut,
        Undo,
      ]
    - [Left Clck, Right Clck, Mid Clck, { type: held }, "", ""]
  Button:
    - [Undo, Cut, Copy, Paste, Paste, Copy, Cut, Undo]
    - [Meta, Alt, Ctrl, Shift, Shift, Ctrl, Alt, Meta]
    - ["", Redo, Redo, Redo, Redo, Redo, Redo, ""]
    - [
        { t: Undo, type: held },
        Cut,
        Copy,
        Paste,
        Paste,
        Copy,
        Cut,

        { t: Undo, type: held },
      ]
    - [Left Clck, Right Clck, Mid Clck, Mid Clck, Right Clck, Left Clck]

combos:
  - { p: [4, 5], k: { t: "(", s: ")" }, l: ["Base"] }
  - { p: [5, 6], k: { t: "{", s: "}" }, l: ["Base"] }
  - {
      p: [4, 5, 6],
      k: { t: "[", s: "]" },
      l: ["Base"],
      align: top,
      offset: 0.3,
    }
